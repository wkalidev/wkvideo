[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wkvideo"
version = "0.1.0"
description = "Turn images, a voiceover MP3 and a scenes.json into a 1080x1920 vertical MP4."
readme = "README.md"
license = { text = "MIT (code); OFL-1.1 (bundled Inter font)" }
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0", "faster-whisper>=1.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
wkvideo = "wkvideo.cli:main"

[tool.setuptools]
packages = ["wkvideo", "wkvideo.ideas"]

[tool.setuptools.package-data]
wkvideo = ["fonts/*.ttf", "fonts/*.txt"]
"wkvideo.ideas" = ["feeds.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
